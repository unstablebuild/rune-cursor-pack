animations:
  cursor:
    enabled: true
    # Shaders in this pack (previews in the README). To switch, set "shader"
    # to one of these paths and "duration" to its suggested value:
    #   lightning:  $RUNE_DATADIR/lib/github.com/unstablebuild/rune-cursor-pack/shaders/lightning.kage (350ms)
    #   fire-trail: $RUNE_DATADIR/lib/github.com/unstablebuild/rune-cursor-pack/shaders/fire-trail.kage (250ms)
    #   fire:       $RUNE_DATADIR/lib/github.com/unstablebuild/rune-cursor-pack/shaders/fire.kage (800ms)
    shader: $RUNE_DATADIR/lib/$RUNE_PKG_ID/shaders/lightning.kage
    duration: 350ms